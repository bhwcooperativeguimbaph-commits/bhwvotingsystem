openapi: 3.1.0
info:
  title: BHW Guimba MongoDB Rehearsal API
  version: '2026-11-02'
  description: 'Code-matched API inventory and selected validated JSON fields. This is a staging contract baseline, not a production certification; remaining response-schema refinements and real browser/Atlas acceptance are tracked in DEVELOPMENT_HANDOFF.md.'
servers:
  - url: /
tags:
  - name: Public
  - name: Member
  - name: Administration
  - name: SuperAdmin
paths:
  /api/admin/areas:
    get:
      summary: "List membership area dropdown options"
      tags: [Administration]
      x-required-role: "admin-or-superadmin"
      x-implementation-status: 'rehearsal-code; not live-approved'
      security:
        - sessionCookie: []
      responses:
        '200':
          description: JSON array of area names
          content:
            application/json:
              schema:
                type: object
                required: [success, areas]
                properties:
                  success: {type: boolean}
                  areas: {type: array, items: {type: string}}
        '403':
          description: Administrator session required
        '503':
          description: Area lookup unavailable
    post:
      summary: "Create an area for member registration"
      tags: [Administration]
      x-required-role: "admin-or-superadmin"
      x-implementation-status: 'rehearsal-code; not live-approved'
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, maxLength: 100}
      responses:
        '201':
          description: Area created
        '400':
          description: Invalid name
        '403':
          description: Administrator session required
        '409':
          description: Area already exists
        '503':
          description: Area storage unavailable
  /api/admin/analytics:
    get:
      summary: "Aggregate-only latest-election daily and area participation"
      tags: [Administration]
      x-required-role: "admin-or-superadmin"
      x-implementation-status: 'rehearsal-code; not live-approved'
      security:
        - sessionCookie: []
      responses:
        '200':
          description: JSON success or stage-specific status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          description: Invalid request or verification data
        '403':
          description: Unauthorized, forbidden, or staging voting disabled
        '409':
          description: Duplicate or election lifecycle conflict
        '503':
          description: Service or MongoDB dependency unavailable
