<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Administrator Login | BHW Guimba</title>
<link rel="stylesheet" href="/css/mongo-portal.css">
<style>body{font:16px system-ui;margin:0;min-height:100vh;color:#17354b;background:#f4f8f6}.auth-card{box-sizing:border-box;max-width:470px;margin:clamp(30px,9vh,110px) auto;padding:clamp(24px,4vw,42px);border:1px solid #d6e5dc;border-radius:22px;background:white;box-shadow:0 24px 65px #163b3017}.auth-card h1{margin-top:0}.auth-card label{display:block;font-weight:650;margin-top:17px}.auth-card input,.auth-card button{box-sizing:border-box;display:block;width:100%;padding:14px;margin:10px 0;font:inherit;border-radius:10px}.auth-card button{background:#17664e;color:white;border:0;cursor:pointer;font-weight:750}.auth-card input{border:1px solid #b8cfc3}.auth-card p{line-height:1.6}#message{white-space:pre-wrap}form[hidden]{display:none!important}@media(max-width:520px){.auth-card{margin:16px;padding:24px}}</style>
<header class="portal-top access-header"><a class="portal-brand" href="/"><span class="portal-emblem" aria-hidden="true"><img src="/assets/logo.svg" alt="" width="40" height="40"></span><span>BHW Guimba Voting System<small>Administration</small></span></a></header>

<main class="auth-card"><h1>Administrator login</h1><p id="authInstruction">Enter your username and password. We’ll send a one-time verification code to your registered email.</p>
<form id="credentials"><label>Username<input id="username" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button>Send verification code</button></form>
<p><a href="/admin-password-recovery">Forgot password</a></p>
<form id="otpForm" hidden><p>Enter the six-digit code sent to your registered email address.</p><label>Six-digit email code<input id="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code"></label><button>Verify login</button></form>
<p id="message" role="status" aria-live="polite"></p></main>
<script>
'use strict';
let challenge=null;
const msg=document.getElementById('message');
async function request(url,body){
 const controller=new AbortController();
 const timeout=setTimeout(()=>controller.abort(),20000);
 try {
  const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(body),signal:controller.signal});
  const data=await res.json();return {status:res.status,data};
 } finally {clearTimeout(timeout)}
}
document.getElementById('credentials').addEventListener('submit',async ev=>{
 ev.preventDefault();msg.textContent='Checking credentials...';
 try{const {data}=await request('/api/admin/login-password',{username:document.getElementById('username').value,password:document.getElementById('password').value});
 document.getElementById('password').value='';
 if(data.mfaRequired&&data.challenge){challenge=data.challenge;document.getElementById('credentials').hidden=true;document.getElementById('otpForm').hidden=false;document.getElementById('authInstruction').textContent='Identity verification';document.getElementById('otp').focus();msg.textContent='Verification code sent. Check your email.'}
 else msg.textContent=(data.message||'Authentication unavailable')+(data.code?' ('+data.code+')':'');
 }catch(e){msg.textContent=e.name==='AbortError'?'Request timed out. Check your connection or Render logs for Brevo or database delays.':'Request failed. Check Render logs.'}
});
document.getElementById('otpForm').addEventListener('submit',async ev=>{
 ev.preventDefault();
 try{const {data}=await request('/api/admin/login-otp',{challenge,code:document.getElementById('otp').value});
 document.getElementById('otp').value='';if(data.success){msg.textContent='Administrator login successful. Opening the dashboard…';window.location.assign('/admin-console')}
 else msg.textContent=data.message||'Verification failed';
 }catch(_){msg.textContent='Request failed'}
});
</script>
