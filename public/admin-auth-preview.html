<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BHW Admin Authentication Preview</title>
<style>body{font:16px system-ui;max-width:440px;margin:8vh auto;padding:20px;color:#142235}input,button{display:block;width:100%;box-sizing:border-box;padding:12px;margin:10px 0;font:inherit}button{background:#184780;color:#fff;border:0;border-radius:6px}input{border:1px solid #aaa;border-radius:6px}p{line-height:1.5}#message{white-space:pre-wrap}</style>
<h1>Admin authentication test</h1><p>MongoDB preview only. Registration and voting are disabled.</p>
<form id="credentials"><label>Username<input id="username" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button>Send verification code</button></form>
<form id="otpForm" hidden><label>Six-digit email code<input id="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code"></label><button>Verify login</button></form>
<button id="session" type="button">Check session</button><button id="logout" type="button">Log out</button><p id="message" role="status" aria-live="polite"></p>
<script>
'use strict';
let challenge=null;
const msg=document.getElementById('message');
async function request(url,body){
 const controller=new AbortController();
 const timeout=setTimeout(()=>controller.abort(),20000);
 try {
  const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(body),signal:controller.signal});
  const data=await res.json();return {status:res.status,data};
 } finally {clearTimeout(timeout)}
}
document.getElementById('credentials').addEventListener('submit',async ev=>{
 ev.preventDefault();msg.textContent='Checking credentials...';
 try{const {data}=await request('/api/admin/login-password',{username:document.getElementById('username').value,password:document.getElementById('password').value});
 document.getElementById('password').value='';
 if(data.mfaRequired&&data.challenge){challenge=data.challenge;document.getElementById('otpForm').hidden=false;msg.textContent='Verification code sent. Check your email.'}
 else msg.textContent=data.message||data.code||'Authentication unavailable';
 }catch(e){msg.textContent=e.name==='AbortError'?'Request timed out. Check Render logs for SMTP or database delays.':'Request failed. Check Render logs.'}
});
document.getElementById('otpForm').addEventListener('submit',async ev=>{
 ev.preventDefault();
 try{const {data}=await request('/api/admin/login-otp',{challenge,code:document.getElementById('otp').value});
 document.getElementById('otp').value='';msg.textContent=data.success?'Administrator login successful. Check session to verify.':data.message||'Verification failed';
 }catch(_){msg.textContent='Request failed'}
});
document.getElementById('session').addEventListener('click',async()=>{
 try{const r=await fetch('/api/session',{credentials:'same-origin'});const d=await r.json();msg.textContent=d.success?'Authenticated role: '+d.role:'No active session';}catch(_){msg.textContent='Request failed'}
});
document.getElementById('logout').addEventListener('click',async()=>{
 try{const {data}=await request('/api/logout',{});msg.textContent=data.success?'Logged out':data.message;}catch(_){msg.textContent='Request failed'}
});
</script>
