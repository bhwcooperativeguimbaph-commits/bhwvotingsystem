name: MongoDB Preview Staging Smoke Test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Render staging without credentials
        env:
          BHW_STAGING_URL: https://bhwguimba.onrender.com
        run: node scripts/smoke-mongo-preview.js
