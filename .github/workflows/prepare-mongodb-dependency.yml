name: Prepare MongoDB dependency
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/prepare-mongodb-dependency.yml'
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Generate consistent dependency manifest and lockfile
        run: npm install 'mongodb@^6' --package-lock-only --save --ignore-scripts --no-audit --no-fund
      - name: Validate updated lockfile and JavaScript syntax
        run: |
          node -e "const p=require('./package.json'),l=require('./package-lock.json'); if(!p.dependencies.mongodb || p.dependencies.mongodb!==l.packages[''].dependencies.mongodb || !l.packages['node_modules/mongodb']) process.exit(1)"
          npm test
      - name: Commit validated manifest and lockfile to main
        run: |
          if git diff --quiet -- package.json package-lock.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m "Install MongoDB Node driver with consistent npm lockfile"
          git push origin HEAD:main
